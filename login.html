<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <meta http-equiv="x-ua-compatible" content="ie=edge" />
    <meta
      name="google-signin-client_id"
      content="YOUR_CLIENT_ID.apps.googleusercontent.com"
    />
    <title>GreenTech-login-page</title>
    <!-- MDB icon -->
    <link
      rel="icon"
      href="img/Her Beauty Logo - Original with Transparent Background  Without Name and Slogan- 54x59  - .png"
      type="image/x-icon"
    />
    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
    <!-- Google Fonts Roboto -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap"
    />
    <!-- MDB -->
    <script src="https://apis.google.com/js/platform.js" async defer></script>
    <link rel="stylesheet" href="style/style.css" />
  </head>
  <body id="user-registration-login-body">
    <form class="form" onsubmit="return false" autocomplete="off">
      <div class="login-container">
        <div class="login-box">
          <img
            src="img/Her Beauty Logo - Original with Transparent Background  Without Name and Slogan- 54x59  - .png"
            alt="Company Logo"
            class="company-logo"
          />
          <div class="form-inner">
            <h2>Login</h2>
            <div class="input-wrapper">
              <div class="input-group">
                <i class="fa-regular fa-user"> </i>
                <input
                  style="font-size: medium"
                  type="text"
                  id="login-username"
                  class="form-control"
                  placeholder="Enter your username"
                  required
                />
              </div>
            </div>

            <div class="input-wrapper">
              <div class="input-group">
                <i class="fa-solid fa-lock"></i>
                <input
                  style="font-size: medium"
                  type="text"
                  id="login-username"
                  class="form-control"
                  placeholder="Enter your password"
                  required
                />
              </div>
            </div>

            <a
              class="normal"
              class="btn btn-warning btn-block mb-3"
              style="text-decoration: none; font-size: smaller"
              href="regestration.html"
              >Don't have an account? Regester here.</a
            >

            <a
              class="btn btn-wa mb-3"
              style="text-decoration: none"
              href="forgitpassword.html"
              >Forgot password?</a
            >
          </div>
          <div class="google-signin text-center mt-3">
            <div class="g-signin2" data-onsuccess="onSignIn"></div>
          </div>
        </div>
      </div>
    </form>
    <!-- Custom scripts -->
    <script type="loginandregester.js"></script>
  </body>
</html>
